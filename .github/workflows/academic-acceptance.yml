name: Academic acceptance — functional Linux and Windows
on:
  pull_request:
    branches: [main]
    paths:
      - 'app.py'
      - 'src/traveler_agent/academic_acceptance.py'
      - 'src/traveler_agent/batch.py'
      - 'src/traveler_agent/research_data/academic_acceptance_*.json'
      - 'scripts/*academic_acceptance.py'
      - 'scripts/acceptance_gradio_http.py'
      - 'scripts/check_asr_readiness.py'
      - 'scripts/analyze_academic_acceptance.py'
      - 'tests/test_academic_acceptance.py'
      - '.github/workflows/academic-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  GRADIO_ANALYTICS_ENABLED: 'False'
  TOKENIZERS_PARALLELISM: 'false'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  REGISTRATION: e20326484aa33d335e85bf0f8551c24adbbd13e1
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install CPU packages, without model checkpoints
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r research/requirements-beto-v3.txt -e '.[ui,test,asr]'
      - name: Full regression on Linux
        if: runner.os == 'Linux'
        run: python -m pytest -q
      - name: Windows application and audio contracts
        if: runner.os == 'Windows'
        run: python -m pytest -q tests/test_academic_acceptance.py tests/test_multiagent.py tests/test_batch.py tests/test_audio_asr.py tests/test_audio_ui.py tests/test_model_runtime.py tests/test_ui_smoke.py tests/test_ui_multiagent_view.py tests/test_ui_midnight_indigo.py
      - name: Execute functional contracts with actual DEMO LR and SVM
        run: python scripts/run_academic_acceptance.py functional --registration-commit ${{ env.REGISTRATION }} --output artifacts/academic-ci/functional.json
      - name: Actual Gradio HTTP, uploads, session corrections and downloads
        run: python scripts/acceptance_gradio_http.py --registration-commit ${{ env.REGISTRATION }} --output artifacts/academic-ci/http.json
      - name: Diagnose ASR packages and CPU, without downloading or loading weights
        run: python scripts/check_asr_readiness.py --require-packages --output artifacts/academic-ci/asr-readiness.json
      - name: Verify saved predictive responses and metrics, without new predictions
        run: python scripts/analyze_academic_acceptance.py --output artifacts/academic-ci/frozen-predictive-analysis.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: academic-functional-${{ runner.os }}
          path: artifacts/academic-ci/*.json
          if-no-files-found: error
