name: Tests
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main, feat/tourism-corpus-foundation]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[ui,test]'
      - name: Test
        run: python -m pytest -q
