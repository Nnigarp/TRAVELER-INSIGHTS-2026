name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/batch-human-review]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[ui,test]'
      - name: Test
        run: python -m pytest -q
